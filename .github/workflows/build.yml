name: Fabriquer l'appli TV
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copier le lecteur dans l'appli
        run: |
          mkdir -p android/app/src/main/assets
          cp docs/player.html docs/store.js docs/config.js android/app/src/main/assets/
      - name: Construire l'APK
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          gradle -p android assembleRelease -PwebBase="https://${OWNER}.github.io/${REPO}/"
          cp android/app/build/outputs/apk/release/app-release.apk EcranBenauge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EcranBenauge
          path: EcranBenauge.apk
      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Écran Benauge v${{ github.run_number }}
          files: EcranBenauge.apk
