<!doctype html>
<html lang="fr">
<head>

<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Nunito Sans','Segoe UI',system-ui,sans-serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000}

.scene.on{opacity:1}
#video{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:contain;background:#000}

.home,.announce{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;padding:64px 88px;display:flex;color:#FDE4D4}
.home{flex-direction:column;gap:32px}
.announce{flex-direction:column;justify-content:space-between}
.bgl{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.rel{position:relative}
.russo{font-family:'Russo One','Arial Black',Impact,sans-serif;font-weight:400}
.hhead{display:flex;align-items:center;justify-content:space-between}
.hleft{display:flex;align-items:center;gap:24px}
.hright{display:flex;align-items:center;gap:20px}
.temp{font-size:104px;line-height:1}
.cond{font-size:48px;font-weight:600;margin-left:20px}
.brand{font-size:34px;font-weight:600;color:#F6C7A9}
.hcenter{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hello{margin:0;font-size:104px;line-height:1.05;text-transform:uppercase;letter-spacing:2px;color:#F26B1D}
.welcome{margin:8px 0 0;font-size:64px;line-height:1.1;font-weight:800}
.clock{margin-top:24px;font-size:216px;line-height:1;font-variant-numeric:tabular-nums}
.date{margin-top:8px;font-size:48px;font-weight:500;color:#F6C7A9}
.saint{margin-top:8px;font-size:40px;font-weight:700;color:#FDE4D4}
.saint b{color:#F26B1D;font-weight:800}
.tip{box-sizing:border-box;height:196px;padding:0 56px;border:3px solid #F26B1D;border-radius:28px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.tip .lab{font-size:28px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#F26B1D}
.tip .txt{font-size:52px;font-weight:700;line-height:1.2}

.ahead{display:flex;justify-content:space-between;align-items:center}
.pill{display:flex;align-items:baseline;gap:16px;padding:10px 32px;border:3px solid #F26B1D;border-radius:999px}
.announce>*{position:relative}
.abody{display:flex;flex-direction:column;gap:28px;max-width:1080px}
.alab{font-size:40px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#F26B1D}
.atitle{margin:0;font-size:96px;line-height:1.08;text-transform:uppercase;letter-spacing:1px}
.asub{margin:0;font-size:48px;line-height:1.3;color:#F6C7A9}
.afoot{display:flex;align-items:center;gap:24px;font-size:38px;font-weight:600;color:#F6C7A9}

/* bloc météo centré (annonce + accueil 2) */
.wb{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.wbicon svg{width:150px;height:150px;display:block}
.wbtemp{font-size:170px;line-height:1;margin-top:6px}
.wbcond{font-size:46px;font-weight:700;margin-top:10px}
.wbmm{font-size:32px;font-weight:600;color:#F6C7A9;margin-top:14px}
.awx{position:absolute;left:1240px;top:150px;width:592px;height:780px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.awx .ghost{position:absolute;left:36px;top:130px;width:520px;height:520px;opacity:.07}
.awx .ghost svg{width:100%;height:100%}
/* accueil 2 : 3 cartes d'infos */
.home2{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;padding:64px 88px;display:flex;gap:48px;color:#FDE4D4}
.h2left{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.h2brand{display:flex;align-items:center;gap:20px;font-size:34px;font-weight:600;color:#F6C7A9}
.h2hello{margin:26px 0 0;font-size:84px;line-height:1.05;text-transform:uppercase;letter-spacing:2px;color:#F26B1D}
.h2welcome{margin:6px 0 0;font-size:52px;line-height:1.1;font-weight:800}
.cards{margin-top:auto;display:flex;flex-direction:column;gap:18px}
.card{border-radius:26px;padding:18px 30px 20px;box-sizing:border-box}
.card .cl{font-size:24px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#F26B1D}
.card .ct{font-size:42px;font-weight:800;line-height:1.1;margin-top:2px}
.card .cb{font-size:31px;font-weight:600;line-height:1.22;color:#F6C7A9;margin-top:6px}
.h2panel{width:640px;flex:none;box-sizing:border-box;border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:24px 32px;border:3px solid rgba(242,107,29,.55)}
.h2time{font-size:168px;line-height:1;font-variant-numeric:tabular-nums}
.h2date{font-size:36px;font-weight:600;color:#F6C7A9;margin-top:10px}
.h2sep{width:70%;height:3px;background:rgba(253,228,212,.25);margin:30px 0 24px;border-radius:2px}
.h2saint{margin-top:26px;font-size:34px;font-weight:700}
.h2saint b{color:#F26B1D;font-weight:800}


/* ===== scènes météo : ciel + silhouette de Bordeaux + bandeau ===== */
.sc{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;color:var(--ink)}
.sc-sky,.sc-deco{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.sc-city{position:absolute;left:0;display:block}
.sc-band{position:absolute;left:0;bottom:0;width:1920px;box-sizing:border-box;padding:0 88px;color:#FDE4D4;display:flex}
.sc-top{position:absolute;left:88px;right:88px;top:52px;display:flex;justify-content:space-between;align-items:center}
.sc-brand{display:flex;align-items:center;gap:20px;font-size:36px;font-weight:700}
.sc-wx{display:flex;align-items:center;gap:22px}
.sc-wx .t{font-size:96px;line-height:1}
.sc-wx .l{font-size:36px;font-weight:800;line-height:1.15}
.sc-wx .m{font-size:28px;font-weight:700;color:var(--sub)}
.sc b{color:var(--acc);font-weight:800}
.h1-left{position:absolute;left:88px;top:200px;width:940px}
.h1-hello{margin:0;font-size:150px;line-height:1;text-transform:uppercase;letter-spacing:2px;color:var(--acc)}
.h1-wel{margin:20px 0 0;font-size:64px;line-height:1.12;font-weight:800}
.h1-right{position:absolute;right:88px;top:190px;text-align:right}
.h1-clock{font-size:250px;line-height:.95;font-variant-numeric:tabular-nums}
.h1-date{font-size:46px;font-weight:800;margin-top:16px}
.h1-saint{font-size:38px;font-weight:700;color:var(--sub);margin-top:4px}
.sc-tip{flex-direction:column;justify-content:center;gap:4px}
.sc-tip .lab{font-size:28px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#F26B1D}
.sc-tip .txt{font-size:46px;font-weight:800;line-height:1.18}
.h2-clock{font-size:104px;line-height:1;font-variant-numeric:tabular-nums}
.h2-left{position:absolute;left:88px;top:186px;width:1100px}
.h2-hello{margin:0;font-size:112px;line-height:1;text-transform:uppercase;letter-spacing:2px;color:var(--acc)}
.h2-wel{margin:14px 0 0;font-size:52px;line-height:1.12;font-weight:800}
.h2-date{font-size:40px;font-weight:800;margin-top:34px}
.h2-saint{font-size:34px;font-weight:700;color:var(--sub);margin-top:2px}
.h2-wx{position:absolute;right:88px;top:196px;width:560px;display:flex;flex-direction:column;align-items:center;text-align:center}
.h2-cards{align-items:stretch;padding-top:38px;padding-bottom:30px}
.h2-card{flex:1;padding:0 40px;border-left:3px solid rgba(253,228,212,.2)}
.h2-card:first-child{padding-left:0;border-left:0}
.h2-card .cl{font-size:24px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#F26B1D}
.h2-card .ct{font-size:44px;font-weight:800;line-height:1.1;margin-top:4px}
.h2-card .cb{font-size:30px;font-weight:600;line-height:1.25;color:#F6C7A9;margin-top:10px}
.wb .wbrow{display:flex;align-items:center;gap:18px;justify-content:center}
.wb .wbtemp{margin-top:0}
.wb .wbmm{color:var(--sub)}
.an-left{position:absolute;left:88px;top:230px;width:1090px}
.an-lab{font-size:40px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc)}
.an-title{margin:22px 0 0;font-size:100px;line-height:1.06;text-transform:uppercase;letter-spacing:1px}
.an-sub{margin:26px 0 0;font-size:46px;font-weight:700;color:var(--sub)}
.an-wx{position:absolute;left:1240px;top:210px;width:592px;display:flex;flex-direction:column;align-items:center;text-align:center}
.an-foot{align-items:center;gap:24px;font-size:38px;font-weight:700}
.an-date{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}
.ho-left{position:absolute;left:88px;top:214px;width:980px}
.ho-left.ho-big{width:1740px}
.ho-row{margin-top:34px}
.ho-d{font-size:46px;font-weight:800}
.ho-h{font-size:58px;line-height:1.08;color:var(--acc);margin-top:2px}
.ho-big .ho-row{margin-top:46px}
.ho-big .ho-d{font-size:56px}
.ho-big .ho-h{font-size:112px}
.ho-msg{position:absolute;left:1100px;top:214px;width:732px;box-sizing:border-box;border-radius:44px;background:#F26B1D;color:#1D2A44;padding:44px 48px;box-shadow:0 18px 50px rgba(15,22,40,.25)}
.ho-mt{font-size:60px;line-height:1.05;text-transform:uppercase}
.ho-mx{font-size:46px;font-weight:800;line-height:1.22;margin-top:18px}
@keyframes cl-drift{from{transform:translateX(-70px)}to{transform:translateX(70px)}}
.bx>*{position:relative}

/* promos (pages type PDF) */
.promo{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box;padding:64px 88px;display:flex;flex-direction:column;background:#FDE4D4;color:#1D2A44;overflow:hidden}
.phead{display:flex;justify-content:space-between;align-items:center}
.pbrand{font-size:36px;font-weight:700}
.pcount{font-size:32px;font-weight:700;color:#5d5550}
.pmain{flex:1;display:flex;align-items:center;justify-content:space-between;gap:40px}
.pleft{max-width:1000px}
.ptag{font-size:40px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#D4520A}
.ptitle{margin:18px 0 0;font-size:108px;line-height:1.05;text-transform:uppercase;letter-spacing:1px}
.psub{margin:26px 0 0;font-size:50px;line-height:1.25;font-weight:700;color:#3a4663}
.pvalid{display:inline-block;margin-top:40px;padding:12px 32px;border:4px solid #E85D0C;border-radius:999px;font-size:40px;font-weight:800}
.pright{position:relative;width:760px;height:760px;flex:none}
.pblob{position:absolute;left:40px;top:20px;width:680px;height:680px;border-radius:50%;background:#FBD2B8}
.part{position:absolute;left:120px;top:40px;width:540px;height:540px;animation:pfloat 7s ease-in-out infinite}
.part svg{width:100%;height:100%}
.pbadge{position:absolute;left:0;top:420px;width:330px;height:330px;border-radius:50%;background:#E85D0C;color:#FDE4D4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 30px rgba(29,42,68,.25);animation:ppulse 5s ease-in-out infinite}
.pbig{font-size:100px;line-height:1}
.psmall{font-size:30px;font-weight:800;margin-top:10px;padding:0 28px;line-height:1.1}
.pfoot{font-size:26px;font-weight:600;color:#7b6a60}
@keyframes pfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes ppulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}


/* écrans bonus : quiz, air et pollens, services, équipe, coin enfants */
.bx{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box;padding:64px 88px;display:flex;flex-direction:column;color:var(--ink);overflow:hidden}
.bxh{display:flex;justify-content:space-between;align-items:center}
.bxbrand{font-size:36px;font-weight:600;color:var(--sub)}
.bxlab{font-size:36px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--acc)}
.bxm{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.bxf{display:flex;align-items:center;gap:28px;font-size:34px;font-weight:600;color:var(--sub);min-height:48px}
.bxbar{flex:1;height:10px;border-radius:6px;background:var(--track);overflow:hidden}
.bxbar b{display:block;height:100%;width:100%;background:#F26B1D;transform-origin:left;animation:bxs linear forwards}
@keyframes bxs{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.bxt{margin:0;font-size:92px;line-height:1.08;max-width:1560px}
.bxs{margin:26px 0 0;font-size:46px;line-height:1.3;font-weight:600;color:var(--sub);max-width:1480px}
.qa{display:flex;gap:32px;margin-top:64px}
.qo{flex:1;display:flex;align-items:center;gap:26px;border-radius:36px;padding:36px 34px;font-size:56px;font-weight:800;line-height:1.1;box-sizing:border-box}
.qo i{font-style:normal;flex:none;width:92px;height:92px;border-radius:50%;background:#F26B1D;color:#1D2A44;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:800}
.qo.ok{background:#F26B1D!important;color:#1D2A44}
.qo.ok i{background:#1D2A44;color:var(--acc)}
.qo.no{opacity:.3}
.bp2{display:flex;gap:48px;margin-top:40px}
.bpan{flex:1;border-radius:44px;padding:44px 52px;box-sizing:border-box;min-height:620px;display:flex;flex-direction:column}
.bpl{font-size:32px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc)}
.bpbig{font-size:120px;line-height:1.05;margin-top:18px}
.bpsub{font-size:36px;font-weight:600;color:var(--sub);margin-top:8px}
.scale{display:flex;gap:6px;margin-top:44px;position:relative}
.scale span{flex:1;height:22px;border-radius:6px}
.mark{position:absolute;top:-14px;width:8px;height:50px;border-radius:4px;background:var(--ink)}
.bpt{font-size:38px;line-height:1.3;font-weight:600;margin-top:auto}
.prow{display:flex;align-items:center;gap:22px;margin-top:22px;font-size:40px;font-weight:800}
.prow .pn{width:260px}
.prow .pb{display:flex;gap:8px}
.prow .pb i{display:block;width:62px;height:24px;border-radius:7px;background:var(--track)}
.prow .pl{font-size:32px;font-weight:700;color:var(--sub)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:36px}
.st{display:flex;align-items:center;gap:36px;border-radius:40px;padding:40px 44px;min-height:250px;box-sizing:border-box}
.st svg{width:150px;height:150px;flex:none}
.st .stt{font-size:56px;font-weight:800;line-height:1.1}
.st .stb{font-size:34px;font-weight:600;color:var(--sub);margin-top:8px;line-height:1.25}
.tm{display:flex;gap:40px;margin-top:50px;justify-content:center}
.tc{width:380px;border-radius:44px;padding:44px 24px;text-align:center;box-sizing:border-box}
.tc .av{width:200px;height:200px;border-radius:50%;margin:0 auto;background:#1D2A44;border:6px solid #F26B1D;display:flex;align-items:center;justify-content:center}
.tc .tn{font-size:54px;font-weight:800;margin-top:26px}
.tc .tr{font-size:32px;font-weight:600;color:var(--sub);margin-top:6px;line-height:1.2}
.kf{display:flex;gap:48px;align-items:center;margin-top:34px}
.kfield{flex:none;width:1120px;height:600px;border-radius:44px;position:relative;overflow:hidden}
.kfield svg{width:100%;height:100%;display:block}
.kside{flex:1;text-align:center}
.knum{font-size:300px;line-height:1;color:var(--acc)}
.kring{fill:none;stroke:#FDE4D4;stroke-width:6;stroke-dasharray:10 8;animation:kp 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes kp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

.ntag{font-size:28px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc)}
.nw{display:flex;gap:30px;align-items:stretch;height:700px}
.nh{flex:1.25;min-width:0;border-radius:44px;background:#1D2A44;color:#FDE4D4;padding:50px 56px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;box-shadow:0 14px 40px rgba(15,22,40,.25)}
.npill{align-self:flex-start;background:#F26B1D;color:#1D2A44;font-size:28px;font-weight:800;letter-spacing:2px;text-transform:uppercase;border-radius:999px;padding:9px 26px}
.nht{margin:28px 0 0;color:#fff;line-height:1.1;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.nhx{font-size:36px;line-height:1.3;font-weight:600;margin-top:24px;color:#FDE4D4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.nhs{font-size:26px;font-weight:700;margin-top:26px;color:#F9B48A}
.nl{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}
.nlh{font-size:28px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--sub)}
.ni{flex:1;min-height:0;border-radius:34px;padding:22px 34px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;border-left:12px solid #F26B1D;box-shadow:0 10px 30px rgba(15,22,40,.12)}
.nit{font-size:34px;line-height:1.16;font-weight:800;margin-top:6px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.nix{font-size:27px;line-height:1.25;font-weight:600;color:var(--sub);margin-top:10px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.nl.one .ni{padding:40px 44px}
.nl.one .ntag{font-size:30px}
.nl.one .nit{font-size:46px;-webkit-line-clamp:4;margin-top:12px}
.nl.one .nix{font-size:33px;line-height:1.3;-webkit-line-clamp:6;margin-top:20px}
.nisrc{font-size:24px;font-weight:700;color:var(--sub);margin-top:14px;opacity:.85}
.nw.solo .nh{flex:none;width:100%;padding:60px 90px}

.mw{display:flex;gap:16px;justify-content:center;margin-top:50px}
.ml,.mi{width:150px;height:180px;display:flex;align-items:center;justify-content:center;font-family:'Russo One','Arial Black',sans-serif;font-size:120px;border-radius:26px;background:var(--track)}
.mi{border:6px dashed var(--acc);color:var(--acc);background:none}
.mi.mo{background:#F26B1D;color:#1D2A44;border-style:solid}
.kx .kxx{stroke:#E8503C;stroke-width:9;stroke-linecap:round;opacity:0}
.kreveal .kx .kxx{opacity:1}
.ktxt{opacity:1}
.kreveal .klast{stroke:none;fill:#F26B1D}
.kreveal .ktxt{fill:#1D2A44}

.zm{display:flex;gap:30px;align-items:stretch;height:700px}
.zm .nh{flex:none;width:660px}
.zr{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;justify-content:center}
.zh{font-size:28px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--sub)}
.zp{display:flex;gap:28px;align-items:center;border-radius:34px;padding:24px 34px;line-height:1.24;font-weight:700}
.zc{flex:none;width:70px;height:70px;border-radius:50%;background:#F26B1D;color:#1D2A44;display:flex;align-items:center;justify-content:center;font-size:38px}

.bx{padding-bottom:128px}
.bxbrand{color:var(--ink);font-weight:700}
.bxf{position:absolute!important;left:88px;right:88px;bottom:24px;color:#FDE4D4;font-weight:700}
.bxbar{background:rgba(253,228,212,.22)}
.bx .bpan,.bx .st,.bx .tc,.bx .nc,.bx .zp,.bx .qo{box-shadow:0 10px 30px rgba(15,22,40,.12)}
.promo>*{position:relative}

/* barre de commande (apparait quand on bouge la souris) */
#bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:96vw;padding:10px 14px;background:rgba(15,20,35,.88);color:#FDE4D4;border-radius:14px;font-size:14px;z-index:10;transition:opacity .4s;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#bar button,#bar select{font:inherit;font-weight:700;color:#FDE4D4;background:#2C3C60;border:1px solid #4a5d86;border-radius:8px;padding:7px 12px;cursor:pointer}
#bar button:hover{background:#F26B1D;border-color:#F26B1D;color:#1D2A44}
#bar label{display:flex;align-items:center;gap:6px;opacity:.9}
#status{min-width:220px;text-align:center;font-weight:600}
#live{font-size:12px;opacity:.75}
body.idle #bar{opacity:0;pointer-events:none}
body.idle{cursor:none}
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#F26B1D;color:#1D2A44;font-weight:800;padding:10px 18px;border-radius:10px;font-size:16px;z-index:11;display:none}

/* animations des fonds */
@keyframes fs-glow{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}
@keyframes fs-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes fs-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.fs-glow{animation:fs-glow 12s ease-in-out infinite}
.fs-beams{animation:fs-spin 240s linear infinite}
.fs-rays{transform-origin:44px 44px;animation:fs-spin 40s linear infinite}
.fs-rays-big{transform-origin:200px 200px;animation:fs-spin 120s linear infinite}
@keyframes fs-sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes fs-fly{from{transform:translateX(-140px)}to{transform:translateX(2060px)}}
@keyframes fs-flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.65)}}
.fs-sway{animation:fs-sway 28s ease-in-out infinite alternate}
.fs-fly{animation:fs-fly 60s linear infinite}
@keyframes fs-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.fs-bob{animation:fs-bob 8s ease-in-out infinite}
.fs-flap{transform-origin:0 0;animation:fs-flap 1.3s ease-in-out infinite}
.fs-disc{transform-origin:200px 200px;animation:fs-pulse 10s ease-in-out infinite}
@keyframes fp-fall-a{from{transform:translateY(0)}to{transform:translateY(420px)}}
@keyframes fp-fall-b{from{transform:translateY(0)}to{transform:translateY(300px)}}
@keyframes fp-drop{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes fp-cloud{0%{transform:translateX(-3px)}50%{transform:translateX(4px)}100%{transform:translateX(-3px)}}
.fp-rain-a{animation:fp-fall-a 1.3s linear infinite}
.fp-rain-b{animation:fp-fall-b 2s linear infinite}
.fp-drop{animation:fp-drop 1.4s ease-in infinite}
.fp-cloud{animation:fp-cloud 12s ease-in-out infinite}
@keyframes fn-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fn-moon{0%,100%{opacity:.8}50%{opacity:1}}
.fn-star{animation:fn-twinkle 5s ease-in-out infinite}
.fn-moon{animation:fn-moon 9s ease-in-out infinite}
@keyframes fc-drift-a{from{transform:translateX(-90px)}to{transform:translateX(120px)}}
@keyframes fc-drift-b{from{transform:translateX(110px)}to{transform:translateX(-100px)}}
@keyframes fc-icon-a{0%{transform:translateX(-3px)}50%{transform:translateX(4px)}100%{transform:translateX(-3px)}}
@keyframes fc-icon-b{0%{transform:translateX(3px)}50%{transform:translateX(-4px)}100%{transform:translateX(3px)}}
.fc-a{animation:fc-drift-a 60s ease-in-out infinite alternate}
.fc-b{animation:fc-drift-b 80s ease-in-out infinite alternate}
.fc-c{animation:fc-drift-a 100s ease-in-out infinite alternate}
.fc-icon-front{animation:fc-icon-a 12s ease-in-out infinite}
.fc-icon-back{animation:fc-icon-b 14s ease-in-out infinite}
@keyframes fo-fall-a{from{transform:translateY(0)}to{transform:translateY(420px)}}
@keyframes fo-fall-b{from{transform:translateY(0)}to{transform:translateY(300px)}}
@keyframes fo-flash{0%,89%{opacity:0}89.4%{opacity:1}90.6%{opacity:.25}91.6%{opacity:.9}94%{opacity:.1}100%{opacity:0}}
@keyframes fo-bolt{0%,89%{opacity:.85}90.5%{opacity:1}92%{opacity:.6}93.5%{opacity:1}100%{opacity:.85}}
@keyframes fo-cloud{0%{transform:translateX(-3px)}50%{transform:translateX(4px)}100%{transform:translateX(-3px)}}
.fo-rain-a{animation:fo-fall-a 1.1s linear infinite}
.fo-rain-b{animation:fo-fall-b 1.7s linear infinite}
@keyframes fo-strike{0%,89%{opacity:0}89.4%{opacity:1}90.6%{opacity:.35}91.6%{opacity:1}93.6%{opacity:.45}95%{opacity:0}100%{opacity:0}}
.fo-strike{opacity:0;animation:fo-strike 11s linear infinite}
.fo-flash{animation:fo-flash 11s linear infinite}
.fo-bolt{animation:fo-bolt 11s linear infinite}
.fo-cloud{animation:fo-cloud 12s ease-in-out infinite}

#pair .pk{font-size:3vw;font-weight:700;color:#F6C7A9}

var FORCED = {
  soleil:  { temp:17, label:'Ensoleillé',  min:8,  max:18, wind:10 },
  couvert: { temp:11, label:'Couvert',     min:9,  max:12, wind:18 },
  pluie:   { temp:9,  label:'Pluie',       min:7,  max:10, wind:22 },
  orage:   { temp:19, label:'Orage',       min:14, max:21, wind:35 },
  nuit:    { temp:6,  label:'Nuit claire', min:4,  max:10, wind:8 }
};
var LIVE = { ok:false, temp:14, code:2, isDay:true, min:9, max:15, wind:15 };

function classify(code, isDay){
  var v, label;
  if (code>=95) { v='orage'; label='Orage'; }
  else if ((code>=51 && code<=67) || (code>=80 && code<=82)) {
    v='pluie';
    label = code<=55 ? 'Bruine' : (code<=57 ? 'Bruine verglaçante' : (code<=65 ? 'Pluie' : (code===66||code===67 ? 'Pluie verglaçante' : 'Averses')));
  }
  else if ((code>=71 && code<=77) || code===85 || code===86) { v='couvert'; label='Neige'; }
  else if (code===45 || code===48) { v='couvert'; label='Brouillard'; }
  else if (code===3) { v='couvert'; label='Couvert'; }
  else {
    if (!isDay) { v='nuit'; label = code===0 ? 'Nuit claire' : 'Nuit nuageuse'; }
    else { v='soleil'; label = code===0 ? 'Ensoleillé' : (code===1 ? 'Plutôt dégagé' : 'Éclaircies'); }
  }
  if (!isDay && (v==='couvert') && label==='Couvert') { /* nuit couverte : fond couvert */ }
  return { variant:v, label:label };
}
function getWeather(){
  if (CFG.weatherMode !== 'auto') { var f = FORCED[CFG.weatherMode]; return { variant:CFG.weatherMode, label:f.label, temp:f.temp, min:f.min, max:f.max, wind:f.wind }; }
  var c = classify(LIVE.code, LIVE.isDay);
  return { variant:c.variant, label:c.label, temp:LIVE.temp, min:LIVE.min, max:LIVE.max, wind:LIVE.wind };
}
function loadWeather(){
  var h = new Date().getHours(); LIVE.isDay = (h>=7 && h<19);
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,weather_code,is_day,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis')
    .then(function(r){ return r.json(); })
    .then(function(j){ var c=j.current; LIVE = { ok:true, temp:Math.round(c.temperature_2m), code:c.weather_code, isDay:c.is_day===1, wind:Math.round(c.wind_speed_10m), min:Math.round(j.daily.temperature_2m_min[0]), max:Math.round(j.daily.temperature_2m_max[0]) }; updateLive(); })
    .catch(function(){ LIVE.ok=false; updateLive(); });
}
function updateLive(){
  var el=document.getElementById('live');
  el.textContent = CFG.weatherMode==='auto' ? (LIVE.ok ? '● météo en direct' : '○ météo de démonstration (hors ligne)') : '○ météo simulée';
}

/* ---------- date / heure / saint ---------- */
function pad(n){ return (n<10?'0':'')+n; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtDate(d){ return cap(d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})); }
function fmtDateShort(d){ return cap(d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})); }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function saintHTML(d){
  var s = (SAINTS[d.getMonth()]||[])[d.getDate()-1] || '';
  if (!s) return '';
  if (s.charAt(0)==='*') return 'Aujourd\'hui : <b>'+s.slice(1)+'</b>';
  return 'Saint du jour : <b>'+s+'</b>';
}

var lastTip = {};
function pickTip(v){
  var arr = TIPS[v], n;
  do { n = Math.floor(Math.random()*arr.length); } while (arr.length>1 && n===lastTip[v]);
  lastTip[v]=n; return arr[n];
}

var MOTS = ['PHARMACIE','SIROP','VITAMINE','BROSSE','SOURIRE','SAVON','DENTISTE','MEDECIN','PANSEMENT','THERMOMETRE'];
function gameMot(){
  var w=MOTS[rnd(MOTS.length)], pos=rnd(w.length), good=w.charAt(pos), alpha='ABCDEFGHIJLMNOPRSTUV', opts=[good];
  while (opts.length<3){ var c=alpha.charAt(rnd(alpha.length)); if (opts.indexOf(c)<0) opts.push(c); }
  opts=shuffle(opts);
  return { type:'mot', title:'Quelle lettre manque ?', word:w, pos:pos, opts:opts, ok:opts.indexOf(good), good:good, q1:11, q2:7 };
}
function makeKid(not){
  var all=['count','intrus','math','quiz','mot'].filter(function(k){ return not.indexOf(k)<0; });
  var k=all[rnd(all.length)];
  if (k==='count') return { id:k, g:gameCount() };
  if (k==='intrus') return { id:k, g:gameIntrus() };
  if (k==='math') return { id:k, g:gameMath() };
  if (k==='mot') return { id:k, g:gameMot() };
  var qz=drawQuiz(QUIZK,'k'), order=shuffle([0,1,2]);
  return { id:k, g:{ type:'quiz', c:{ q:qz.q, exp:qz.exp, o:order.map(function(i){return qz.o[i];}), ok:order.indexOf(qz.ok), label:'Quiz des enfants' }, q1:10, q2:9 } };
}
function shapeSVG(it, reveal){
  var g='<g transform="translate('+it.x+' '+it.y+') rotate('+it.rot+')">';
  if (it.kind==='circle') g+='<circle r="'+it.r+'" fill="'+it.color+'"/>';
  else if (it.kind==='tri') g+='<polygon points="0,'+(-it.r)+' '+(it.r*0.95)+','+(it.r*0.75)+' '+(-it.r*0.95)+','+(it.r*0.75)+'" fill="'+it.color+'"/>';
  else { var pts=[]; for (var i=0;i<10;i++){ var a=-Math.PI/2+i*Math.PI/5, rr=(i%2?it.r*0.45:it.r); pts.push((Math.cos(a)*rr).toFixed(1)+','+(Math.sin(a)*rr).toFixed(1)); } g+='<polygon points="'+pts.join(' ')+'" fill="'+it.color+'" stroke-linejoin="round"/>'; }

}

setInterval(function(){
  var now=Date.now(), dt=now-lastTick; lastTick=now;
  if (paused || !started) { phaseStart+=dt; return; }
  var d=new Date();
  var t=document.getElementById('h-time'); if(t) t.textContent=fmtTime(d);
  var dd=document.getElementById('h-date'); if(dd) dd.textContent=fmtDate(d);
  var sa=document.getElementById('h-saint'); if(sa) sa.innerHTML=saintHTML(d);
  var t2=document.getElementById('h2-time'); if(t2) t2.textContent=fmtTime(d);
  var d2=document.getElementById('h2-date'); if(d2) d2.textContent=fmtDate(d);
  var s2=document.getElementById('h2-saint'); if(s2) s2.innerHTML=saintHTML(d);
  var ad=document.getElementById('a-date'); if(ad) ad.textContent=fmtDateShort(d)+' · '+fmtTime(d);
  var gb=document.getElementById('gbar'), fr=-1;
  if (phase==='video' || phase==='rappel') { if (video.duration>0) fr=1-video.currentTime/video.duration; }
  else if (phase!=='bonus' && phaseDur>0) fr=1-(now-phaseStart)/phaseDur;
  gb.style.display = fr>=0 ? 'block' : 'none';
  if (fr>=0) gb.firstChild.style.transform='scaleX('+Math.max(0,Math.min(1,fr)).toFixed(4)+')';
  if (phase!=='video' && phase!=='rappel' && now-phaseStart>=phaseDur) advance(); else setStatus();
}, 250);

/* ---------- commandes ---------- */
function fit(){ var s=Math.min(innerWidth/1920, innerHeight/1080), st=document.getElementById('stage');
  st.style.transform='scale('+s+')'; st.style.left=((innerWidth-1920*s)/2)+'px'; st.style.top=((innerHeight-1080*s)/2)+'px'; }
addEventListener('resize', fit); fit();

function togglePause(){
  paused=!paused; document.getElementById('b-pause').textContent = paused ? '▶' : '⏸';
  if (phase==='video' || phase==='rappel') { if (paused) video.pause(); else { var p=video.play(); if(p&&p.catch) p.catch(function(){}); } }
}
function toggleFull(){ if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){}); else document.exitFullscreen(); }
function setWeather(m){ CFG.weatherMode=m; document.getElementById('s-weather').value=m; updateLive(); if (phase==='home') { scHome.innerHTML=homeHTML(); } else if (phase==='home2') { scHome2.innerHTML=home2HTML(); } else if (phase==='announce') { scAnn.innerHTML=announceHTML(PLAYLIST[idx]); } else if (phase==='bonus') { var bb=bonusQueue[bonusPos]; scBonus.innerHTML=bb.html(Math.max(1,Math.ceil((phaseDur-(Date.now()-phaseStart))/1000))); } }

document.getElementById('b-next').onclick=advance;
document.getElementById('b-prev').onclick=prev;
document.getElementById('b-pause').onclick=togglePause;
document.getElementById('b-full').onclick=toggleFull;
document.getElementById('s-home').onchange=function(){ CFG.homeSeconds=+this.value; if(phase==='home') phaseDur=CFG.homeSeconds*1000; this.blur(); };
document.getElementById('s-homes').onchange=function(){ CFG.homeMode=this.value; this.blur(); };
document.getElementById('s-rappel').onchange=function(){ CFG.rappel=this.value; this.blur(); };
document.getElementById('s-news').onchange=function(){ var v=+this.value; CFG.news=v>0; if (v>0) CFG.newsEvery=v; this.blur(); };
document.getElementById('s-bonus').onchange=function(){ CFG.bonusCount=+this.value; this.blur(); };
document.getElementById('s-pollen').onchange=function(){ CFG.pollenMode=this.value; this.blur(); };
document.getElementById('s-promo').onchange=function(){ CFG.promoCount=+this.value; this.blur(); };
document.getElementById('s-rate').onchange=function(){ CFG.videoRate=+this.value; applyRate(); this.blur(); };
document.getElementById('s-weather').onchange=function(){ setWeather(this.value); this.blur(); };
addEventListener('keydown', function(e){
  if (e.target && e.target.tagName==='SELECT') return;
  var k=e.key;
  if (k===' ') { e.preventDefault(); togglePause(); }
  else if (k==='ArrowRight') advance();
  else if (k==='ArrowLeft') prev();
  else if (k==='f' || k==='F') toggleFull();
  else if (k==='0') setWeather('auto');
  else if (k==='1') setWeather('soleil');
  else if (k==='2') setWeather('couvert');
  else if (k==='3') setWeather('pluie');
  else if (k==='4') setWeather('orage');
  else if (k==='5') setWeather('nuit');
});

var idleT;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(function(){ if(!document.querySelector('#bar:hover')) document.body.classList.add('idle'); }, 3000); }
addEventListener('mousemove', wake); addEventListener('mousedown', wake); wake();

loadWeather(); setInterval(loadWeather, 10*60*1000); updateLive();
loadAir(); setInterval(loadAir, 30*60*1000);

/* =====================================================================
   LIAISON AVEC LA PAGE DE CONTRÔLE
   ===================================================================== */
var started=false, HAS_SHELL = !!(window.Shell && Shell.sync);
var SHELL_BASE='https://appassets.androidplatform.net/media/';
var Q=new URLSearchParams(location.search);
if (!Q.get('bar')) document.body.classList.add('tv');

/* --- fichiers (vidéos, promos) : gardés dans la TV, ou en mémoire dans un navigateur --- */
var Media = { blobs:{}, busy:{}, want:[] };
Media.fname = function(f, kind){ return f.id+'_'+String(f.modified||0)+(kind==='video'?'.mp4':'.png'); };
Media.url = function(f, kind){
  var n=Media.fname(f,kind);
  if (HAS_SHELL) { try { return Shell.ready(n) ? SHELL_BASE+n : null; } catch(e){ return null; } }
  return Media.blobs[n] || null;
};
Media.sync = function(items){
  Media.want=items;
  if (HAS_SHELL) { try { Shell.sync(JSON.stringify({ gas: CFG.gasUrl, items: items.map(function(x){ return { file: Media.fname(x.f,x.kind), id: x.f.id, action: x.kind==='video'?'file':'promo' }; }) })); } catch(e){} return; }
  var next=items.filter(function(x){ var n=Media.fname(x.f,x.kind); return !Media.blobs[n] && !Media.busy[n]; })[0];
  if (!next || Media.loading) return;
  var n=Media.fname(next.f,next.kind); Media.busy[n]=true; Media.loading=true;
  EB.gas({ action: next.kind==='video'?'file':'promo', id: next.f.id }).then(function(j){
    var bin=atob(j.b64), u=new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    Media.blobs[n]=URL.createObjectURL(new Blob([u], { type: j.mime || (next.kind==='video'?'video/mp4':'image/png') }));
  }).catch(function(){ setTimeout(function(){ delete Media.busy[n]; }, 60000); }).then(function(){ Media.loading=false; rebuild(); Media.sync(Media.want); });
};

/* --- construit la liste de lecture à partir des réglages --- */
function rebuild(){
  var st=EB.state, files=st.files||{}, vids=files.videos||[], meta=st.videos||{}, pmeta=st.promos||{};
  var rid = CFG.rappelId || ((vids.filter(function(f){ return /rappel/i.test(f.name); })[0]||{}).id) || '';
  var want=[], list=[], cur=PLAYLIST[idx] && PLAYLIST[idx].id;
  vids.forEach(function(f){
    var m=meta[f.id]||{}, isR=(f.id===rid);
    var on = isR ? CFG.rappel!=='off' : (m.fixed || f.base) ? true : (m.on==null ? CFG.autoAdd!==false : m.on===true);
    if (!on) return;
    want.push({ f:f, kind:'video' });
    var u=Media.url(f,'video'); if (!u) return;
    if (isR) { RAPPEL.file=u; return; }
    list.push({ id:f.id, file:u, title:m.title||EB.titleFromName(f.name), pos:(m.pos==null?9999:m.pos), name:f.name });
  });
  if (!vids.some(function(f){ return f.id===rid && Media.url(f,'video'); })) RAPPEL.file='';
  list.sort(function(a,b){ return a.pos-b.pos || a.name.localeCompare(b.name); });
  PLAYLIST=list;
  if (cur) { var k=list.map(function(x){return x.id;}).indexOf(cur); if (k>=0) idx=k; }
  if (idx>=PLAYLIST.length) idx=0;
  var today=new Date().toISOString().slice(0,10), pr=[];
  (files.promos||[]).forEach(function(f){
    var m=pmeta[f.id]||{}; if (m.on===false) return; if (m.until && m.until<today) return;
    want.push({ f:f, kind:'promo' });
    var u=Media.url(f,'promo'); if (u) pr.push({ id:f.id, img:u, title:f.name });
  });
  REAL_PROMOS=pr;
  var t=st.team||{}; TEAM = (t.show===false) ? [] : (t.members||[]).filter(function(m){ return m && m.name; });
  return want;
}
var lastCfgJson='', lastCmdTs=0;
function applyState(){
  var c=EB.cfg(), j=JSON.stringify(c), wm=CFG.weatherMode;
  if (j!==lastCfgJson) { lastCfgJson=j; Object.assign(CFG, c); applyRate();
    if (phase==='home' || phase==='home2') phaseDur=CFG.homeSeconds*1000;
    if (wm!==CFG.weatherMode) setWeather(CFG.weatherMode); }
  Media.sync(rebuild());
  if (phase==='hours') { var oj=JSON.stringify(EB.opening()); if (oj!==applyState._o) { applyState._o=oj; scBonus.innerHTML=hoursHTML(); } }
  var cmd=EB.state.cmd;
  if (cmd && cmd.ts && cmd.ts!==lastCmdTs) { var first=(lastCmdTs===0); lastCmdTs=cmd.ts; if (!first && Date.now()-cmd.ts<60000) runCmd(cmd); }
  if (!started && EB._gotFirst) { started=true; beforeHomes(); }
}
function runCmd(c){
  if (c.type==='next') advance();
  else if (c.type==='prev') prev();
  else if (c.type==='pause') { if (!paused) togglePause(); }
  else if (c.type==='play') { if (paused) togglePause(); }
  else if (c.type==='reload') location.reload();
  else if (c.type==='sync') { refreshFiles(); refreshNews(true); }
  else if (c.type==='playVideo') { var k=PLAYLIST.map(function(x){return x.id;}).indexOf(c.arg); if (k>=0) { idx=k; try{video.pause();}catch(e){} if (paused) togglePause(); enterAnnounce(); } }
  else if (c.type==='show') { if (paused) togglePause(); try{video.pause();}catch(e){}
    if (c.arg==='home') enterHome(); else if (c.arg==='home2') enterHome2(); else if (c.arg==='hours') enterHours(); else if (c.arg==='promos') afterHours(); else if (c.arg==='bonus') afterPromos(); }
}
var lastStatusKey='';
function pushStatus(){
  if (!started) return;
  var label = phase==='video' ? 'Vidéo : '+((PLAYLIST[idx]||{}).title||'') : phase==='rappel' ? 'Vidéo de rappel' : phase==='announce' ? 'Annonce : '+((PLAYLIST[idx]||{}).title||'') :
    phase==='promo' ? 'Promo '+(promoPos+1)+'/'+promoQueue.length : phase==='bonus' ? ((bonusQueue[bonusPos]||{}).title||'Écran bonus') : phase==='home2' ? 'Accueil (infos)' : phase==='hours' ? 'Horaires de la pharmacie' : 'Accueil';
  var key=label+'|'+paused+'|'+sleeping+'|'+PLAYLIST.length+'|'+REAL_PROMOS.length;
  if (key===lastStatusKey) return; lastStatusKey=key;
  EB.set('status', { label:label, phase:phase, paused:paused, sleeping:sleeping, videos:PLAYLIST.length, promos:REAL_PROMOS.length, videoId:(PLAYLIST[idx]||{}).id||'', shell:HAS_SHELL, ts:Date.now() }).catch(function(){});
}
setInterval(function(){ lastStatusKey=''; }, 60000);

/* --- Google Drive : liste des fichiers et actualités --- */
function refreshFiles(){
  if (!CFG.gasUrl) return;
  EB.gas({ action:'list' }).then(function(j){
    var old=JSON.stringify([(EB.state.files||{}).videos,(EB.state.files||{}).promos]);
    if (JSON.stringify([j.videos,j.promos])!==old) EB.set('files', { videos:j.videos||[], promos:j.promos||[], folder:j.folder||'', ts:Date.now() });
    else EB.set('files/ts', Date.now());
  }).catch(function(){});
}
function refreshNews(force){
  if (!CFG.gasUrl || !CFG.newsAuto) return;
  var n=EB.state.news||{}; if (!force && n.fetched && Date.now()-n.fetched < 6*3600*1000) return;
  EB.gas({ action:'news' }).then(function(j){ if (j && j.items && j.items.length>=1) EB.set('news', { maj:j.maj, items:j.items.slice(0,4), auto:true, fetched:Date.now() }); }).catch(function(){});
}
setInterval(refreshFiles, 10*60*1000); setInterval(function(){ refreshNews(false); }, 30*60*1000);
setInterval(function(){ if (HAS_SHELL || Media.want.length) { rebuild(); } }, 15000);

/* --- horaires : écran noir en dehors des heures d'ouverture --- */
var sleeping=false;
function checkHours(){
  var on=CFG.hoursOn, off=CFG.hoursOff, s=false;
  if (on && off && on!==off) { var d=new Date(), t=pad(d.getHours())+':'+pad(d.getMinutes()); s = on<off ? !(t>=on && t<off) : !(t>=on || t<off); }
  if (s===sleeping) return; sleeping=s;
  document.getElementById('sleep').style.display = s ? 'block' : 'none';
  if (s) { if (!paused) togglePause(); } else { if (paused) togglePause(); }
}
setInterval(checkHours, 20000);
/* rechargement chaque nuit, pour repartir propre */
setInterval(function(){ var d=new Date(); if (d.getHours()===4 && d.getMinutes()===0 && performance.now()>3600000) location.reload(); }, 50000);

/* --- démarrage : association puis lecture --- */
function startLinked(){
  document.getElementById('pair').style.display='none';
  EB.listen(function(){ EB._gotFirst=true; applyState(); });
  setTimeout(function(){ if (!started) { EB._gotFirst=true; applyState(); } }, 8000);
  setTimeout(function(){ refreshFiles(); refreshNews(false); checkHours(); }, 4000);
}
function startPairing(){
  var pc=(EB.newCode(6)).toUpperCase(); 
  document.getElementById('pair').style.display='flex';
  document.getElementById('pair-code').textContent=pc.slice(0,3)+' '+pc.slice(3);
  document.getElementById('pair-url').textContent=location.origin.indexOf('appassets')>=0 ? '' : location.href.replace(/player\.html.*$/,'admin.html');
  var stop=EB.watch('pair/'+pc, function(v){ if (v && v.code) { stop(); EB.setCode(v.code); EB.rawSet('pair/'+pc, null); startLinked(); } });
}
if (EB.code()) startLinked(); else startPairing();

</script>
