plugins { id 'com.android.application' }

android {
    namespace 'fr.benauge.ecran'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.benauge.ecran'
        minSdk 23
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        // Adresse des pages publiées (GitHub Pages), d'où l'appli récupère les mises à jour du lecteur.
        buildConfigField 'String', 'WEB_BASE', '"' + (project.findProperty('webBase') ?: '') + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        ecran {
            storeFile file('benauge.keystore')
            storePassword 'benauge-ecran'
            keyAlias 'ecran'
            keyPassword 'benauge-ecran'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.ecran }
        debug { signingConfig signingConfigs.ecran }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
